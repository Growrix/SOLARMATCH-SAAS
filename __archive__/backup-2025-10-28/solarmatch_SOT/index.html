<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolarMatch - Solar Savings & Rebate Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#0D9488', // Teal 600
              secondary: '#FACC15', // Yellow 400
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'fade-in-up': 'fade-in-up 0.8s ease-out',
              'slide-in-left': 'slideInLeft 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              'fade-in-up': {
                'from': { opacity: 0, transform: 'translateY(30px)' },
                'to': { opacity: 1, transform: 'translateY(0)' },
              },
              slideInLeft: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* --- START UNIFIED THEME STYLES --- */
      
      /* Base light theme colors */
      body {
        background-color: #F2F0EF;
        color: #0F172A; /* text-slate-900 */
      }

      /* Base dark theme colors */
      .dark body {
        background-color: #000000;
        color: #E2E8F0; /* text-slate-200 */
      }
      
      /* 'System' theme overrides */
      .dark.theme-system body {
        background-color: #001405;
        color: #FFFFFF;
      }
      .dark.theme-system footer,
      .dark.theme-system .hero-section {
          background-color: #001405;
      }
       .dark.theme-system .hero-section .gradient-overlay{
          background: none;
      }

      /* --- GLASSMORPHISM HEADER STYLES --- */
      .glass-header, .glass-top-bar {
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border-bottom-width: 1px;
      }

      /* Light Mode */
      .glass-header {
        background: linear-gradient(to bottom, rgba(242, 240, 239, 0.7), rgba(242, 240, 239, 0.4));
        border-bottom-color: rgba(229, 231, 235, 0.7); /* gray-200/70 */
      }
      .glass-top-bar {
        background: linear-gradient(to bottom, rgba(242, 240, 239, 0.9), rgba(242, 240, 239, 0.6));
        border-bottom-color: rgba(209, 213, 219, 0.8); /* gray-300/80 for a subtle shadow */
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.7); /* Inner top highlight for 3D effect */
      }

      /* Dark Mode */
      .dark .glass-header {
        background: linear-gradient(to bottom, rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.3));
        border-bottom-color: rgba(51, 65, 85, 0.5); /* slate-700/50 */
      }
      .dark .glass-top-bar {
        background: linear-gradient(to bottom, rgba(30, 41, 59, 0.5), rgba(15, 23, 42, 0.3)); /* slate-800/50 to slate-900/30 */
        border-bottom-color: rgba(71, 85, 105, 0.4); /* slate-600/40 */
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.075); /* Inner top highlight for 3D effect */
      }

      /* System Theme Dark Mode */
      .dark.theme-system .glass-header {
        background: linear-gradient(to bottom, rgba(0, 20, 5, 0.7), rgba(0, 20, 5, 0.3));
        border-bottom-color: rgba(13, 148, 136, 0.3);
      }
      .dark.theme-system .glass-top-bar {
        background: linear-gradient(to bottom, rgba(13, 148, 136, 0.25), rgba(0, 20, 5, 0.6));
        border-bottom-color: rgba(13, 148, 136, 0.5); /* A bit stronger */
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15); /* Slightly more prominent highlight */
      }

      /* --- UNIFIED CARD STYLES --- */
      .theme-card {
          transition: all 0.3s ease;
          border-radius: 1rem; /* rounded-2xl */
      }

      /* Light mode base */
      .theme-card {
          background-color: #ffffff; /* Opaque white for better visibility */
          border: 1px solid #e5e7eb; /* gray-200 for a sleek border */
          box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05); /* Subtle shadow */
      }
      .theme-card:hover {
        transform: translateY(-4px);
        border-color: rgba(13, 148, 136, 0.4); /* Match dark theme's border highlight */
        box-shadow: 0 10px 20px rgba(13, 148, 136, 0.1), 0 0 0 1px rgba(13, 148, 136, 0.2); /* Match dark theme's glow effect */
      }

      /* Dark & System mode glassmorphism */
      .dark .theme-card, .dark.theme-system .theme-card {
          background-color: rgba(15, 23, 42, 0.3); /* slate-900/30 */
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid rgba(51, 65, 85, 0.5); /* slate-700/50 */
          box-shadow: 
              0 0 0 1px rgba(13, 148, 136, 0.2), /* Inner neon border */
              0 8px 32px 0 rgba(13, 148, 136, 0.1); /* Outer neon glow */
      }

      .dark .theme-card:hover, .dark.theme-system .theme-card:hover {
          transform: translateY(-4px);
          border-color: rgba(13, 148, 136, 0.4);
          box-shadow: 
              0 0 0 1px rgba(13, 148, 136, 0.4), /* Inner neon border hover */
              0 8px 40px 0 rgba(13, 148, 136, 0.25); /* Outer neon glow hover */
      }
      
      /* --- COMPONENT-SPECIFIC BACKGROUND STYLES --- */
      
      .dark.theme-system .blog-section, .dark.theme-system .government-news-section, .dark.theme-system .newsletter-section { background-color: transparent; }


      /* --- BLOG PAGES THEME --- */
      .blog-page-bg { background-color: #F2F0EF; }
      .dark .blog-page-bg { background-color: #000000; }
      .dark.theme-system .blog-page-bg { background-color: #001405; }
      
      .blog-post-page-bg { background-color: #ffffff; }
      .dark .blog-post-page-bg { background-color: #000000; }
      .dark.theme-system .blog-post-page-bg { background-color: #001405; }

      /* --- DASHBOARD PAGES THEME --- */
      .homeowner-dashboard-bg { background-color: #F2F0EF; }
      .dark .homeowner-dashboard-bg { background-color: #000000; }
      .dark.theme-system .homeowner-dashboard-bg { background-color: #001405; }
      
      .dashboard-sidebar { background-color: #ffffff; }
      .dark .dashboard-sidebar { background-color: #000000; }
      .dark.theme-system .dashboard-sidebar { background-color: #001405; }
        
      /* --- MODAL-SPECIFIC THEME STYLES --- */
      .modal-input, .modal-select {
        background-color: rgba(241, 245, 249, 0.8); /* slate-100/80 */
        border: 1px solid rgba(203, 213, 225, 0.5); /* slate-300/50 */
        color: #0F172A; /* slate-900 */
      }
      .dark .modal-input, .dark .modal-select {
        background-color: rgba(30, 41, 59, 0.5); /* slate-800/50 */
        border-color: rgba(51, 65, 85, 0.5); /* slate-700/50 */
        color: #E2E8F0; /* slate-200 */
      }
      .dark.theme-system .modal-input, .dark.theme-system .modal-select {
        background-color: rgba(13, 148, 136, 0.1);
        border-color: rgba(13, 148, 136, 0.3);
        color: #FFFFFF;
      }
      
      .modal-select option {
        background: #FFFFFF;
        color: #0F172A;
      }

      .dark .modal-select option {
        background: #0F172A; /* slate-900 */
        color: #E2E8F0;
      }

      .dark.theme-system .modal-select option {
        background: #002A0E;
        color: #FFFFFF;
      }

      .modal-inner-card {
        background-color: rgba(248, 250, 252, 0.7); /* slate-50/70 */
        border: 1px solid rgba(226, 232, 240, 0.7); /* slate-200/70 */
      }
      .dark .modal-inner-card {
        background-color: rgba(30, 41, 59, 0.5); /* slate-800/50 */
        border-color: rgba(51, 65, 85, 0.7); /* slate-700/70 */
      }
      .dark.theme-system .modal-inner-card {
        background-color: rgba(0, 42, 14, 0.5); /* dark green */
        border-color: rgba(13, 148, 136, 0.3);
      }
      
      .modal-preview-summary {
        background: linear-gradient(to bottom right, rgba(239, 246, 255, 0.7), rgba(240, 249, 255, 0.7)); /* blue-50/70 to cyan-50/70 */
        border: 1px solid rgba(219, 234, 254, 0.5); /* blue-200/50 */
      }
      .dark .modal-preview-summary {
        background: linear-gradient(to bottom right, rgba(30, 58, 138, 0.2), rgba(21, 94, 117, 0.2)); /* blue-900/20 to cyan-800/20 */
        border-color: rgba(30, 64, 175, 0.5); /* blue-800/50 */
      }
      .dark.theme-system .modal-preview-summary {
        background: linear-gradient(to bottom right, rgba(0, 60, 20, 0.3), rgba(0, 40, 10, 0.3));
        border-color: rgba(13, 148, 136, 0.3);
      }

      .prose-styles { color: #334155; }
      .dark .prose-styles { color: #cbd5e1; }
      .prose-styles h1, .prose-styles h2, .prose-styles h3, .prose-styles strong { color: #1e293b; }
      .dark .prose-styles h1, .dark .prose-styles h2, .dark .prose-styles h3, .dark .prose-styles strong { color: #f1f5f9; }
      .prose-styles a { color: #0D9488; }
      .prose-styles blockquote { border-left-color: #0D9488; background-color: #f0fdfa; }
      .dark .prose-styles blockquote { background-color: rgba(13, 148, 136, 0.1); }
      
      /* --- OTHER COMPONENT STYLES --- */
      
      /* This rule hints to the browser to use its dark UI for dropdown panels */
      .dark select { color-scheme: dark; }

      /* --- ANIMATIONS --- */
      @keyframes grid-pan { 0% { background-position: 0% 0%; } 100% { background-position: 50px 50px; } }
      @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(45deg); } 50% { transform: translateY(-20px) rotate(225deg); } }
      @keyframes float-medium { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-15px) scale(1.1); } }
      @keyframes float-fast { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(360deg); } }
      @keyframes pulse-sun { 0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(13, 148, 136, 0.3); } 50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(13, 148, 136, 0.5); } }
      .ray { position: absolute; top: 50%; left: 50%; transform-origin: 0 0; }
      .ray > div { width: 2px; background: linear-gradient(to bottom, rgba(13, 148, 136, 0.8), transparent); border-radius: 1px; transform: translateY(-20px); }
      @keyframes ray-glow { 0%, 100% { opacity: 0.4; height: 20px; } 50% { opacity: 1; height: 30px; } }
      .particle { position: absolute; width: 4px; height: 4px; background: #0D9488; border-radius: 50%; box-shadow: 0 0 10px rgba(13, 148, 136, 0.8); top: 50%; left: 50%; margin-top: -2px; margin-left: -2px; }
      @keyframes particle-flow-1 { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(-150px, 100px); opacity: 0; } }
      @keyframes particle-flow-2 { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(125px, 90px); opacity: 0; } }
      @keyframes particle-flow-3 { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(140px, -110px); opacity: 0; } }
      .panel-surface { width: 100%; height: 100%; position: relative; overflow: hidden; }
      .panel-glow { position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; background: rgba(13, 148, 136, 0.3); border-radius: 6px; opacity: 0; }
      @keyframes panel-track { 0%, 100% { transform: rotateY(-10deg) rotateX(5deg); } 50% { transform: rotateY(10deg) rotateX(-5deg); } }
      @keyframes panel-glow-anim { 0%, 70%, 100% { opacity: 0; } 80%, 90% { opacity: 1; } }
      .installer-how-it-works-section { position: relative; overflow: hidden; padding-top: 6rem; padding-bottom: 6rem; background-color: #F2F0EF; }
      .dark .installer-how-it-works-section { background-color: #050505; }
      .animated-grid-background { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(13, 148, 136, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(13, 148, 136, 0.07) 1px, transparent 1px); background-size: 50px 50px; animation: grid-pan 4s linear infinite; opacity: 0.7; }
      .dark .animated-grid-background { background-image: linear-gradient(rgba(13, 148, 136, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(13, 148, 136, 0.2) 1px, transparent 1px); opacity: 0.5; }
      @keyframes pulse-shadow { 0%, 100% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(13, 148, 136, 0); } }
      .animate-pulse-shadow { animation: pulse-shadow 2s infinite; }
      @keyframes message-fade-in { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .animate-message-fade-in { animation: message-fade-in 0.3s ease-out; }

      /* --- NEW ANIMATED SECTION BACKGROUND --- */
      .animated-section-background {
        position: relative;
        overflow: hidden;
        z-index: 0; /* Establish stacking context */
      }
      .animated-section-background::before,
      .animated-section-background::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1; /* Place behind content */
      }
      /* Faint moving grid lines on hover */
      .animated-section-background::before {
        background-image:
          linear-gradient(rgba(13, 148, 136, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(13, 148, 136, 0.04) 1px, transparent 1px);
        background-size: 75px 75px;
        animation: grid-pan-slow 20s linear infinite;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      .dark .animated-section-background::before {
        background-image:
          linear-gradient(rgba(13, 148, 136, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(13, 148, 136, 0.08) 1px, transparent 1px);
      }
      .animated-section-background:hover::before {
        opacity: 0.5;
      }
      /* Flowing energy orbs */
      .animated-section-background::after {
        background:
          radial-gradient(circle at 10% 20%, rgba(13, 148, 136, 0.05), transparent 30vmax),
          radial-gradient(circle at 80% 30%, rgba(13, 148, 136, 0.04), transparent 40vmax),
          radial-gradient(circle at 30% 90%, rgba(13, 148, 136, 0.03), transparent 50vmax),
          radial-gradient(circle at 90% 80%, rgba(13, 148, 136, 0.06), transparent 35vmax);
        background-size: 200% 200%;
        animation: flow-orbs 30s ease-in-out infinite alternate;
      }
      .dark .animated-section-background::after {
        background:
          radial-gradient(circle at 10% 20%, rgba(13, 148, 136, 0.1), transparent 30vmax),
          radial-gradient(circle at 80% 30%, rgba(13, 148, 136, 0.08), transparent 40vmax),
          radial-gradient(circle at 30% 90%, rgba(13, 148, 136, 0.07), transparent 50vmax),
          radial-gradient(circle at 90% 80%, rgba(13, 148, 136, 0.12), transparent 35vmax);
      }
      .dark.theme-system .animated-section-background::after {
        background:
          radial-gradient(circle at 10% 20%, rgba(13, 148, 136, 0.12), transparent 30vmax),
          radial-gradient(circle at 80% 30%, rgba(13, 148, 136, 0.1), transparent 40vmax),
          radial-gradient(circle at 30% 90%, rgba(13, 148, 136, 0.09), transparent 50vmax),
          radial-gradient(circle at 90% 80%, rgba(13, 148, 136, 0.15), transparent 35vmax);
      }
      @keyframes grid-pan-slow {
        0% { background-position: 0% 0%; }
        100% { background-position: 75px 75px; }
      }
      @keyframes flow-orbs {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
      }

      /* --- FLOATING DOLLARS ANIMATION --- */
      .floating-dollars-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: -1;
      }

      .floating-dollars-container span {
        position: absolute;
        bottom: -50px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.5rem;
        font-weight: bold;
        color: rgba(13, 148, 136, 0.1);
        text-shadow: 0 0 8px rgba(13, 148, 136, 0.2);
        animation-name: float-dollar-1;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .dark .floating-dollars-container span {
        color: rgba(13, 148, 136, 0.12);
        text-shadow: 0 0 12px rgba(13, 148, 136, 0.25);
      }
      .dark.theme-system .floating-dollars-container span {
        color: rgba(13, 148, 136, 0.15);
        text-shadow: 0 0 15px rgba(13, 148, 136, 0.3);
      }
      
      .floating-dollars-container span:nth-child(1) { left: 10%; animation-duration: 20s; animation-delay: 0s; font-size: 1.2rem; }
      .floating-dollars-container span:nth-child(2) { left: 20%; animation-duration: 14s; animation-delay: 2s; font-size: 2rem; }
      .floating-dollars-container span:nth-child(3) { left: 30%; animation-duration: 25s; animation-delay: 5s; font-size: 1rem; }
      .floating-dollars-container span:nth-child(4) { left: 40%; animation-duration: 12s; animation-delay: 1s; font-size: 2.5rem; }
      .floating-dollars-container span:nth-child(5) { left: 50%; animation-duration: 18s; animation-delay: 8s; font-size: 1.5rem; }
      .floating-dollars-container span:nth-child(6) { left: 60%; animation-duration: 13s; animation-delay: 4s; font-size: 2.2rem; }
      .floating-dollars-container span:nth-child(7) { left: 70%; animation-duration: 22s; animation-delay: 10s; font-size: 1.3rem; }
      .floating-dollars-container span:nth-child(8) { left: 80%; animation-duration: 16s; animation-delay: 6s; font-size: 2.8rem; }
      .floating-dollars-container span:nth-child(9) { left: 90%; animation-duration: 19s; animation-delay: 3s; font-size: 1.6rem; }
      .floating-dollars-container span:nth-child(10) { left: 5%; animation-duration: 17s; animation-delay: 7s; font-size: 2.4rem; }
      
      .floating-dollars-container span:nth-child(3n + 1) { animation-name: float-dollar-1; }
      .floating-dollars-container span:nth-child(3n + 2) { animation-name: float-dollar-2; }
      .floating-dollars-container span:nth-child(3n) { animation-name: float-dollar-3; }

      @keyframes float-dollar-1 {
        0% { transform: translateY(0) rotate(-15deg); opacity: 0; }
        10% { opacity: 1; }
        100% { transform: translateY(-110vh) rotate(45deg); opacity: 0; }
      }
      @keyframes float-dollar-2 {
        0% { transform: translateY(0) rotate(15deg); opacity: 0; }
        15% { opacity: 0.8; }
        100% { transform: translateY(-120vh) rotate(-55deg); opacity: 0; }
      }
      @keyframes float-dollar-3 {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        20% { opacity: 0.9; }
        100% { transform: translateY(-105vh) rotate(25deg); opacity: 0; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",

}
</script>
