openapi: 3.0.3
info:
  title: Reset Password
  version: 1.0.0
paths:
  /api/auth/password/reset:
    post:
      summary: Reset user password using a valid token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './common-schemas.yaml#/components/schemas/PasswordResetBody'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/SuccessMessage'
        '400':
          description: Invalid token or password
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/ErrorResponse'
        '410':
          description: Token expired or already used
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/ErrorResponse'
