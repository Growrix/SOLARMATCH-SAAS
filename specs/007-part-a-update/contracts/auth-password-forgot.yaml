openapi: 3.0.3
info:
  title: Request Password Reset
  version: 1.0.0
paths:
  /api/auth/password/forgot:
    post:
      summary: Request a password reset email
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './common-schemas.yaml#/components/schemas/PasswordForgotBody'
      responses:
        '200':
          description: Reset email sent (or no-op for privacy)
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/SuccessMessage'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/RateLimitError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/ErrorResponse'
