openapi: 3.0.3
info:
  title: Request Email Verification
  version: 1.0.0
paths:
  /api/auth/verify/request:
    post:
      summary: Request a verification email for a user
      operationId: requestVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './common-schemas.yaml#/components/schemas/VerifyRequestBody'
      responses:
        '200':
          description: Verification email sent (or no-op for privacy)
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/SuccessMessage'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/RateLimitError'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/ErrorResponse'
